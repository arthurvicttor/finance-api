spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db
    username: ${DB_USERNAME:seu_usuario}
    password: ${DB_PASSWORD:sua_senha}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:seu_secret_aqui}
  expiration: 86400000

logging:
  level:
    com.finance: DEBUG
    org.springframework.security: DEBUG
