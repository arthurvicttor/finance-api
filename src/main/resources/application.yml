spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/finance_db
    username: postgres
    password: dev0410
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

jwt:
  secret: finance-api-secret-key-2024-very-long-string-for-security
  expiration: 86400000 # 24 horas em milissegundos

logging:
  level:
    com.finance: DEBUG
    org.springframework.security: DEBUG